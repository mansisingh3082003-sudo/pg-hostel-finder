<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PG & Hostel Finder</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-buildings-fill"></i>
                <span>PG & Hostel Finder</span>
            </a>
            <div class="ms-auto">
                <a href="register.html" class="btn btn-outline-primary">Create Account</a>
            </div>
        </div>
    </nav>

    <!-- Global Alert Container -->
    <div class="container mt-3" id="alert-container"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4 bg-white">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold mb-1">Welcome Back</h3>
                            <p class="text-muted">Sign in to your PG & Hostel Finder account</p>
                        </div>

                        <!-- Role-Based Quick Login -->
                        <div class="p-3 bg-light rounded-4 mb-4 text-center border">
                            <span class="d-block small text-muted fw-bold mb-2 text-uppercase" style="letter-spacing: 0.5px;">Quick Demo Sign In by Role</span>
                            <div class="btn-group w-100 shadow-sm" role="group">
                                <button type="button" class="btn btn-outline-primary fw-bold py-2 role-btn" id="role-btn-student" onclick="selectRole('STUDENT')">
                                    <i class="bi bi-mortarboard-fill me-1"></i>Student
                                </button>
                                <button type="button" class="btn btn-outline-primary fw-bold py-2 role-btn" id="role-btn-owner" onclick="selectRole('OWNER')">
                                    <i class="bi bi-building-fill me-1"></i>Owner
                                </button>
                                <button type="button" class="btn btn-outline-primary fw-bold py-2 role-btn" id="role-btn-admin" onclick="selectRole('ADMIN')">
                                    <i class="bi bi-shield-check me-1"></i>Admin
                                </button>
                            </div>
                        </div>

                        <form id="login-form">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold" id="btn-login">
                                    Sign In
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-3">
                            <p class="text-muted small mb-0">Don't have an account? <a href="register.html" class="fw-bold text-decoration-none">Sign Up Here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js?v=14"></script>
    <script src="js/auth.js?v=14"></script>
    <script>
        function selectRole(role) {
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            if (role === 'STUDENT') {
                document.getElementById('role-btn-student')?.classList.add('active');
                fillDemo('salonikumari1562001@gmail.com', 'user123');
            } else if (role === 'OWNER') {
                document.getElementById('role-btn-owner')?.classList.add('active');
                fillDemo('monalsinghrajput1310@gmail.com', 'owner123');
            } else if (role === 'ADMIN') {
                document.getElementById('role-btn-admin')?.classList.add('active');
                fillDemo('admin@pghfinder.com', 'admin123');
            }
        }

        function fillDemo(email, pass) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = pass;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.innerText = 'Signing In...';

            const res = await API.post('/auth/login', { email, password });
            btn.disabled = false;
            btn.innerText = 'Sign In';

            if (res.success && res.data) {
                Auth.setUser(res.data);
                showAlert(`Welcome back, ${res.data.name}!`, 'success');
                setTimeout(() => {
                    if (res.data.role === 'OWNER') {
                        window.location.href = 'dashboard-owner.html';
                    } else if (res.data.role === 'ADMIN') {
                        window.location.href = 'dashboard-admin.html';
                    } else {
                        window.location.href = 'dashboard-user.html';
                    }
                }, 800);
            } else {
                showAlert(res.message || 'Invalid credentials.', 'danger');
            }
        });
    </script>
</body>
</html>
