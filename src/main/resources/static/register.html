<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | PG & Hostel Finder</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-buildings-fill"></i>
                <span>PG & Hostel Finder</span>
            </a>
            <div class="ms-auto">
                <a href="login.html" class="btn btn-outline-primary">Sign In</a>
            </div>
        </div>
    </nav>

    <!-- Global Alert Container -->
    <div class="container mt-3" id="alert-container"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6">
                    <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4 bg-white">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold mb-1">Create an Account</h3>
                            <p class="text-muted">Join the verified PG & Hostel Finder community</p>
                        </div>

                        <form id="register-form">
                            <!-- Account Type / Role -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">I want to register as:</label>
                                <div class="row g-2">
                                    <div class="col-6">
                                        <input type="radio" class="btn-check" name="role" id="role-user" value="USER" checked>
                                        <label class="btn btn-outline-primary w-100 py-2 fw-semibold" for="role-user">
                                            <i class="bi bi-mortarboard me-1"></i> Student / Tenant
                                        </label>
                                    </div>
                                    <div class="col-6">
                                        <input type="radio" class="btn-check" name="role" id="role-owner" value="OWNER">
                                        <label class="btn btn-outline-warning text-dark w-100 py-2 fw-semibold" for="role-owner">
                                            <i class="bi bi-building me-1"></i> Property Owner
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Full Name *</label>
                                <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address *</label>
                                <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="tel" id="reg-phone" class="form-control" placeholder="10-digit mobile number">
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password *</label>
                                <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold" id="btn-register">
                                    Create My Account
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-3">
                            <p class="text-muted small mb-0">Already registered? <a href="login.html" class="fw-bold text-decoration-none">Log In</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js?v=14"></script>
    <script src="js/auth.js?v=14"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('role') === 'OWNER') {
                document.getElementById('role-owner').checked = true;
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const phone = document.getElementById('reg-phone').value;
            const password = document.getElementById('reg-password').value;
            const role = document.querySelector('input[name="role"]:checked').value;

            const btn = document.getElementById('btn-register');
            btn.disabled = true;
            btn.innerText = 'Creating account...';

            const res = await API.post('/auth/register', { name, email, phone, password, role });
            btn.disabled = false;
            btn.innerText = 'Create My Account';

            if (res.success && res.data) {
                Auth.setUser(res.data);
                showAlert('Account registered successfully! Redirecting...', 'success');
                setTimeout(() => {
                    if (res.data.role === 'OWNER') {
                        window.location.href = 'dashboard-owner.html';
                    } else {
                        window.location.href = 'dashboard-user.html';
                    }
                }, 900);
            } else {
                showAlert(res.message || 'Registration failed.', 'danger');
            }
        });
    </script>
</body>
</html>
