<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details | PG & Hostel Finder</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-buildings-fill"></i>
                <span>PG & Hostel Finder</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="search.html">Explore PGs</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2" id="nav-auth-container">
                    <!-- Populated dynamically by auth.js -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Global Alert Container -->
    <div class="container mt-3" id="alert-container"></div>

    <main class="py-4">
        <div class="container" id="property-details-container">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">Loading property details...</p>
            </div>
        </div>
    </main>

    <!-- Booking Request Modal -->
    <div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="bookingModalLabel">Send Booking Request</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="booking-request-form">
                        <div class="p-3 bg-light rounded-3 mb-3">
                            <h6 class="fw-bold mb-1" id="modal-property-name">Property Name</h6>
                            <p class="text-muted small mb-0" id="modal-room-summary">Room: Single Sharing - ₹12,000/mo</p>
                        </div>
                        <input type="hidden" id="modal-property-id">
                        <input type="hidden" id="modal-room-id">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Check-in Date *</label>
                            <input type="date" class="form-control" id="modal-checkin-date" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Stay Duration (Months)</label>
                            <select class="form-select" id="modal-duration">
                                <option value="1">1 Month</option>
                                <option value="3" selected>3 Months</option>
                                <option value="6">6 Months</option>
                                <option value="11">11 Months (Academic Year)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Remarks / Message to Owner</label>
                            <textarea class="form-control" id="modal-remarks" rows="2" placeholder="e.g. Student at XYZ College, arriving around 2 PM..."></textarea>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold" id="btn-submit-booking">
                                Confirm &amp; Submit Request
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js?v=9"></script>
    <script src="js/auth.js?v=9"></script>
    <script src="js/property-details.js?v=9"></script>
</body>
</html>
