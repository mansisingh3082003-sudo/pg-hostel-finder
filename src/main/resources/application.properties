# ===================================================================
# PG & Hostel Finder and Booking System - Application Configuration
# ===================================================================

server.port=8081
spring.application.name=pg-hostel-finder

# -------------------------------------------------------------------
# Database Configuration (Default: H2 In-Memory for Instant Run)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:pghfinderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# To Switch to MySQL (as specified in PDR), uncomment below:
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/pghfinder_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root123

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# For MySQL, switch dialect:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Static Web Resources
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
